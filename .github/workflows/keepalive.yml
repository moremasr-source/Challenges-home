name: keepalive
on:
  schedule: [{cron: '0 6 * * 1,4'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/ping?select=id"
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
